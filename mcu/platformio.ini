; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; This is the "Master Switch" that overrides the default 'data' folder

; --- 1. GLOBAL BASE: Shared by ALL projects ---
[base]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/set_data_dir.py

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps = 

; --- 2. FEATURE BASES: ---

; --- MONOCHROME FEATURE BASE ---
[monochrome]
extends = base
custom_asset_path = data/monochrome
build_flags = 
    ${base.build_flags}
    -D SCREEN_MONO
lib_deps = 
    ${base.lib_deps}

; --- COLOUR FEATURE BASE ---
[colour]
extends = base
custom_asset_path = data/colour
build_flags = 
    ${base.build_flags}
    -D SCREEN_COLOUR
lib_deps = 
    ${base.lib_deps}

; --- 3. HARDWARE BASES: ---
;
; --- SSD1315 Driver ---
[ssd1315]
lib_deps = olikraus/U8g2 @ ^2.36.17
build_flags = 
    -D USE_SSD1315 
    -D SCREEN_WIDTH=128
    -D SCREEN_HEIGHT=64
    -D OLED_GND=20
    -D OLED_VCC=10
    -D OLED_SCL=9
    -D OLED_SDA=8
    -D BOOT_IMAGE=boot_image_monochrome

; --- ST7789 Driver ---
[st7789]
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.0
build_flags = 
    -D USE_TFT_ESPI 
    -D ST7789_DRIVER=1
    -D USER_SETUP_LOADED=1
    -D CGRAM_OFFSET=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D DISABLE_ALL_LIBRARY_WARNINGS

; --- 4. ACTUAL BOARD ENVS: ---
[env:esp32-c3-devkit-mono]
extends = monochrome, ssd1315
board = esp32-c3-devkitm-1
build_flags =
    ${monochrome.build_flags}
    ${ssd1315.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev-mono]
extends = monochrome, ssd1315
board = esp32dev
build_flags =
    ${monochrome.build_flags}
    ${ssd1315.build_flags}

; Colour Boards
[env:ttgo-lora32-v1]
extends = colour, st7789
board = ttgo-lora32-v1
build_flags =
    ${colour.build_flags}
    ${st7789.build_flags}
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D SCREEN_WIDTH=240
    -D SCREEN_HEIGHT=135
