; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

; --- 1. GLOBAL BASE: Shared by ALL projects ---
[base]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/set_data_dir.py

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps = 

; --- 2. FEATURE BASES: ---

; --- MONOCHROME FEATURE BASE ---
[monochrome]
extends = base
custom_asset_path = data/monochrome
build_flags = 
    ${base.build_flags}
    -D SCREEN_MONO
lib_deps = 
    ${base.lib_deps}

; --- COLOUR FEATURE BASE ---
[colour]
extends = base
custom_asset_path = data/colour
build_flags = 
    ${base.build_flags}
    -D SCREEN_COLOUR
    -D DEVICE_NAME="\"GlowBug Colour\""
lib_deps = 
    ${base.lib_deps}

; --- 3. HARDWARE BASES: ---
;
; --- SSD1315 Driver ---
[ssd1315]
lib_deps = olikraus/U8g2 @ ^2.36.17
build_flags = 
    -D USE_SSD1315 
    -D SCREEN_WIDTH=128
    -D SCREEN_HEIGHT=64
    -D OLED_GND=20
    -D OLED_VCC=10
    -D OLED_SCL=9
    -D OLED_SDA=8
    -D BOOT_IMAGE=boot_image_monochrome

; --- ST7789 Driver ---
[st7789]
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.0
build_flags = 
    -D USE_TFT_ESPI 
    -D ST7789_DRIVER=1
    -D USER_SETUP_LOADED=1
    ; Shift the drawing coordinates by a pre-defined 
    ; number of pixels so that your image actually appears centered on the glass
    -D CGRAM_OFFSET=1 
    ; Loads the classic, tiny 5x7 pixel "original Arduino" font. It’s very small but very efficient.
    -D LOAD_GLCD=1
    ; Loads a small, clear 16-pixel high proportional font.
    -D LOAD_FONT2=1
    ; Loads a medium 26-pixel high proportional font.
    -D LOAD_FONT4=1
    ; Enable font antialiasing
    -D SMOOTH_FONT=1
    -D DISABLE_ALL_LIBRARY_WARNINGS
    -D BOOT_IMAGE=boot_image_color

; --- GC9A01 Driver ---
[gc9a01]
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.0
build_flags = 
    -D USE_TFT_ESPI 
    -D USER_SETUP_LOADED=1      ; Tells TFT_eSPI to ignore User_Setup.h
    -D GC9A01_DRIVER=1          ; The driver for your round screen
    -D TFT_WIDTH=240            ; GC9A01 is 240x240
    -D TFT_HEIGHT=240
    
    ; --- OPTIONAL FONTS ---
    -D LOAD_GLCD=1              ; Standard Adafruit font
    -D LOAD_FONT2=1             ; Small 16 pixel high font
    -D LOAD_FONT4=1             ; Medium 26 pixel high font
    -D SPI_FREQUENCY=27000000   ; 27 MHz is a safe, fast default

    -D DISABLE_ALL_LIBRARY_WARNINGS
    ; -D BOOT_IMAGE=boot_image_color

; --- 4. ACTUAL BOARD ENVS: ---
[env:esp32-c3-devkit-mono]
extends = monochrome, ssd1315
board = esp32-c3-devkitm-1
build_flags =
    ${monochrome.build_flags}
    ${ssd1315.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev-mono]
extends = monochrome, ssd1315
board = esp32dev
build_flags =
    ${monochrome.build_flags}
    ${ssd1315.build_flags}

; Colour Boards
[env:ttgo-lora32-v1]
extends = colour, st7789
board = ttgo-lora32-v1
build_flags =
    ${colour.build_flags}
    ${st7789.build_flags}
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D SCREEN_WIDTH=240
    -D SCREEN_HEIGHT=135
